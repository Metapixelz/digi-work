version: "3.6"
services:
  coturn:
    image: coturn/coturn:4.6.2
    network_mode: "host"
    restart: ${RESTART_POLICY}
    command:
      - "-n"
      - "--log-file=stdout"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--realm=${COTURN_DOMAIN}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_STATIC_AUTH_SECRET}"
      - "--external-ip=${SERVERIP}"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--no-multicast-peers"
    labels:
      - "traefik.enable=false"
