name: DigiWork-Play

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: metapixelz
  DOCKER_OWNER: alreadydonewithu
  IMAGE_NAME: digi-work-play

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./play/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: ""
          cache-to: ""
